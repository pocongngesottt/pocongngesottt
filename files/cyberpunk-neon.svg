<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Muhamad Fahri Salam — cyberpunk profile" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0014"/>
      <stop offset="1" stop-color="#001a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ff2bd6;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff2bd6">
        <animate attributeName="stop-color" values="#ff2bd6;#00f0ff;#ff2bd6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.12" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="0 40" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="typeclip">
      <rect x="60" y="200" height="50" width="0">
        <animate attributeName="width" values="0;700;700;0" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- top terminal bar -->
  <text x="60" y="48" font-family="'Courier New', monospace" font-size="16" fill="#00f0ff" fill-opacity="0.8">// whoami</text>
  <circle cx="1090" cy="43" r="5" fill="#39ff14" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1105" y="48" font-family="'Courier New', monospace" font-size="14" fill="#39ff14" fill-opacity="0.9">ONLINE</text>

  <!-- glitch title: cyan layer -->
  <text x="60" y="140" font-family="'Courier New', monospace" font-size="62" font-weight="bold" textLength="820" lengthAdjust="spacingAndGlyphs" fill="#00f0ff" opacity="0.8">
    MUHAMAD FAHRI SALAM
    <animate attributeName="x" values="60;60;56;64;60;60" keyTimes="0;0.8;0.84;0.88;0.92;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </text>
  <!-- glitch title: magenta layer -->
  <text x="60" y="140" font-family="'Courier New', monospace" font-size="62" font-weight="bold" textLength="820" lengthAdjust="spacingAndGlyphs" fill="#ff2bd6" opacity="0.8">
    MUHAMAD FAHRI SALAM
    <animate attributeName="x" values="60;60;64;56;60;60" keyTimes="0;0.8;0.84;0.88;0.92;1" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
  </text>
  <!-- main title -->
  <text x="60" y="140" font-family="'Courier New', monospace" font-size="62" font-weight="bold" textLength="820" lengthAdjust="spacingAndGlyphs" fill="url(#neon)" filter="url(#glow)">MUHAMAD FAHRI SALAM</text>

  <!-- neon underline sweeping -->
  <line x1="60" y1="165" x2="880" y2="165" stroke="url(#neon)" stroke-width="3" stroke-dasharray="120 40" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- typing subtitle -->
  <g clip-path="url(#typeclip)">
    <text x="60" y="225" font-family="'Courier New', monospace" font-size="24" textLength="700" lengthAdjust="spacing" fill="#e6faff">&gt; machine learning · computer vision · ionic apps</text>
  </g>
  <rect y="203" width="12" height="26" fill="#00f0ff" filter="url(#glow)">
    <animate attributeName="x" values="60;760;760;60" keyTimes="0;0.5;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- bottom tag -->
  <text x="60" y="290" font-family="'Courier New', monospace" font-size="15" fill="#ff2bd6" fill-opacity="0.85">python · tensorflow · ionic · laravel</text>

  <!-- right side: rotating rings -->
  <g transform="translate(1030 170)" filter="url(#glow)">
    <circle r="70" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="40 20 10 20">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="none" stroke="#ff2bd6" stroke-width="3" stroke-dasharray="20 14">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#39ff14">
      <animate attributeName="r" values="10;16;10" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- scanline -->
  <rect width="1200" height="4" fill="#00f0ff" opacity="0.12">
    <animateTransform attributeName="transform" type="translate" from="0 -4" to="0 320" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- border -->
  <rect x="2" y="2" width="1196" height="316" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
